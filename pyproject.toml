[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[project]
name = "edwh-passbolt-plugin"
description = "Passbolt tasks plugin for edwh"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["edwh", "passbolt"]
authors = [
    { name = "Remco Boerma", email = "remco.b@educationwarehouse.nl" },
    { name = "Robin van der Noord", email = "robin.vdn@educationwarehouse.nl" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "edwh",
    "httpx2",
    "rapidfuzz",
    "rich",
    "threadful",
    "pyotp",
]
version = "0.4.0"

[project.optional-dependencies]
dev = [
    "hatch",
    "black",
]

[project.urls]
Documentation = "https://github.com/educationwarehouse/edwh-passbolt-plugin#readme"
Issues = "https://github.com/educationwarehouse/edwh-passbolt-plugin/issues"
Source = "https://github.com/educationwarehouse/edwh-passbolt-plugin"

# https://packaging.python.org/en/latest/guides/creating-and-discovering-plugins/#using-package-metadata
[project.entry-points."edwh.tasks"]
# namespace: (edwh passbolt.command)
passbolt = "edwh_passbolt_plugin.passbolt_plugin"

[tool.vommit]
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "beta"
confirm = true

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!--next-version-placeholder-->"
placeholder_regex = "<auto>"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
feat = "Feature{s}"
fix = "Fix{es}"
break = "Breaking Change{s}"
docs = "Documentation"
perf = "Performance"

[tool.vommit.pypi]
enabled = true
use_keyring = true

[tool.vommit.commands]
clean = "rm -rf ./dist"
build = "uv build"
publish = "uv publish"
post_publish = ""

[tool.vommit.version_bump_map]
break = "major"
build = "patch"
chore = "patch"
feat = "minor"
fix = "patch"
perf = "patch"
refactor = "patch"

